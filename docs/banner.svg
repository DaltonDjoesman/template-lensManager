<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Lens Manager</title>
  <desc id="desc">Optical lens orders, an SPH/CYL catalog, and proforma PDFs in the browser.</desc>
  <rect width="1280" height="360" fill="#f4efe6"/>
  <rect width="8" height="360" fill="#b45309"/>
  <circle cx="1040" cy="180" r="92" fill="none" stroke="#d6c4a3" stroke-width="10"/>
  <circle cx="1040" cy="180" r="46" fill="none" stroke="#c4a574" stroke-width="6"/>
  <circle cx="1024" cy="164" r="10" fill="#fff7ed" opacity="0.9"/>
  <g font-family="Segoe UI, Ubuntu, sans-serif">
    <text x="72" y="118" fill="#9a3412" font-size="16" letter-spacing="3">PWA / BROWSER ONLY</text>
    <text x="72" y="188" fill="#1c1917" font-size="64" font-weight="700">Lens Manager</text>
    <text x="72" y="236" fill="#57534e" font-size="22">Clients, SPH/CYL catalog, orders, and proforma PDFs.</text>
  </g>
  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="15" fill="#44403c">
    <rect x="72" y="272" width="78" height="32" rx="16" fill="#efe6d6"/>
    <text x="111" y="293" text-anchor="middle">React</text>
    <rect x="162" y="272" width="118" height="32" rx="16" fill="#efe6d6"/>
    <text x="221" y="293" text-anchor="middle">TypeScript</text>
    <rect x="292" y="272" width="64" height="32" rx="16" fill="#efe6d6"/>
    <text x="324" y="293" text-anchor="middle">PWA</text>
  </g>
</svg>
