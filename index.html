<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var v = localStorage.getItem('lens-manager-theme')
          var root = document.documentElement
          var dark =
            v === 'dark' ||
            (v !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (v === 'light' || v === 'dark') {
            root.setAttribute('data-theme', v)
            root.style.colorScheme = v
          }
          var meta = document.querySelector('meta[name="theme-color"]:not([media])')
          if (meta) meta.setAttribute('content', dark ? '#1D1710' : '#F7F2EA')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F2EA" />
    <meta name="theme-color" content="#F7F2EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1D1710" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Lens Manager — portfolio demo PWA for lens order management" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Lens Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
